id: A2
title: "Overfull boxes — a float or line runs past its box"
severity:
applies: {}
source:
  - rules/A2-overfull-boxes.md
exceptions: []
grep:
  - {pattern: "Overfull \\\\[hv]box", target: "compile-log", action: "fix", hint: "fix or justify every hit; report the counts"}
notes: |
  Not asked of a reviewer; the author checks the compile log.

author:
  text: |
    **A2. Overfull boxes — a float or line runs past its box.** `grep -nE 'Overfull \\[hv]box' <compile log>`.
    Fix the float (A6/A7), do not ignore it.
  why: |
    A large `Overfull \hbox` (over ~5pt) on a figure/table page is the top signal that a float or a
    tabular is wider than its column.
  examples: {good: [], bad: []}
