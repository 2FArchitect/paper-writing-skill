id: P8
title: "Principle 8: Takeaway paragraphs in evaluation"
severity:
applies: {sections: [evaluation]}
merged: [CE4]               # the checklist group was this rule's reviewer form
source:
  - rules/P8-takeaway-paragraphs.md
  - rules/CE4-takeaway-paragraphs.md       # the four questions
  - section_rhetorical_moves/evaluation.md:47  # "ties results back to a specific design claim" (question 4)
exceptions: []
grep: []

author:
  text: |
    After every experiment or group of related experiments, insert a Takeaway paragraph that states
    the IMPLICATION, not just the result. **Rule**: Every experiment cluster ends with a Takeaway
    paragraph. It should be interpretable without reading the detailed results — it is the
    skim-reader's entry point.
  why: |
    The Takeaway compresses results into interpretation — it tells the reader the PATTERN, not the
    NUMBERS.
  examples:
    good: ['Takeaway. Our system outperforms all baselines, with the largest margins in challenging conditions.']
    bad: ['Model A: 92%, Model B: 87%, Model C: 84%, Model D: 91%.']

writing:                    # SK8: the author also runs them after drafting
  questions:
    - Does every experiment cluster end with an explicit **"Takeaway."** paragraph?
    - Does the Takeaway state the **implication** (not just the result)?
    - Is the Takeaway interpretable **without reading the detailed results**?
    - Does the Takeaway **tie back to a specific design claim or contribution**?
  why:
  examples: {good: [], bad: []}
