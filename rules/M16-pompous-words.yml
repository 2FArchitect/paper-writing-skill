id: M16
title: Pompous / vague single words
severity:
applies: {}
source:
  - rules/M16-pompous-words.md
  - author_profile/craft_reference.md:22-23   # "Plain words over Latinate" (author)
  - rules/M20-grep-script.md:21-22            # the M16 half of the M5/M16 grep
exceptions: []
notes: |
  The author's bad examples (`utilize`, `sufficient`, `demonstrate`) come from craft_reference's "Plain words over
  Latinate"; only `utilize` has a pattern, in M5's grep.
grep:
  - {pattern: '\bfinaliz|[a-z]+-oriented\b|\bfactor\b|\bfeature[ds]?\b|\bmeaningful\b|\binsightful\b|\bprestigious\b|\bpossess|\bcontact(s|ed|ing)?\b|\bcurrently\b|\bimpact(s|ed|ing)?\b', flags: i, action: audit, hint: 'possess → have; impact (verb) → affect; currently is redundant with present tense'}

author:
  text: |
    **Plain words over Latinate.** `use` not `utilize`; `enough` not `sufficient`; `show` not
    `demonstrate`; `let` not `enable` where it fits.
  why:
  examples:
    good: ['use', 'enough', 'show', 'let', 'have', 'affect']
    bad: ['utilize', 'sufficient', 'demonstrate']

writing:
  text: |
    **M16. Pompous / vague single words — AUDIT.** `finalize` · `-oriented` · `factor` ·
    `feature` · `meaningful` · `insightful` · `prestigious` · `possess` (→ `have`) · `impact` (verb;
    prefer `affect`) · `contact` (verb) · `currently` (redundant with present tense).
  why:
  examples:
    good: ['have', 'affect']
    bad: ['finalize', 'data-oriented', 'factor', 'feature', 'meaningful', 'insightful', 'prestigious', 'possess', 'impact', 'contact', 'currently']
