id: P3
title: "Principle 3: The What → Why → So-What Heading Progression"
severity:
applies: {}
source:
  - rules/P3-what-why-so-what-headings.md
  - rules/CD1-structure.md:5   # checklist question merged
  - rules/CD6-what-why-so-what-test.md:3   # checklist question merged
  - rules/CD6-what-why-so-what-test.md:4   # checklist question merged
  - rules/CD6-what-why-so-what-test.md:5   # checklist question merged
  - rules/CI7-overall.md:2   # checklist question merged
exceptions: []
grep: []

author:
  text: |
    **Rule**: Rewrite every heading to contain the section's CONCLUSION, not just its TOPIC.

    **The test**: Can a skim-reader reconstruct the paper's argument from headings alone? If headings only name topics, the skim-reader gets nothing. If headings contain claims, the skim-reader gets the argument.
  why: |
    Section headings evolve through three stages as a paper matures:

    1. **WHAT headings** (student drafts): descriptive, topic-naming. Example: "Experimental Results"
    2. **WHY headings** (first senior edit): problem-driven. Example: "Why do linear approaches fail?"
    3. **SO-WHAT headings** (final version): claim-first, stating the conclusion. Example: "System X outperforms all baselines by 2–4×"
  examples: {good: [], bad: []}

writing:
  questions:
    - "Are subsection headings **claim-first** (e.g., \"Partial failure as a first-order requirement\") rather than **descriptive** (e.g., \"Retry State Machine\")?"
    - "Does the heading state WHAT the component does? (minimum)"
    - "Does the heading argue WHY this design choice? (better)"
    - "Does the heading state the SO-WHAT implication? (best)"
    - "Can a skim-reader reconstruct the paper's argument from **headings + topic sentences alone**?"
  why:
  examples: {good: [], bad: []}
