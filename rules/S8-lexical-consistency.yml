id: S8
title: "Lexical consistency: one word per concept"
severity: CRITICAL
applies: {}
source:
  - rules/S8-lexical-consistency.md
  - rules/CD4-terminology.md:3   # checklist question merged
exceptions: []
grep: []

writing:
  text: |
    **S8. Lexical consistency: one word per concept (CRITICAL).** Different synonyms for the same
    concept read bombastic and un-academic; this is the most common drift after many revision rounds.
    Extends the base "terminology drift" rule ("Is the same concept called by the same name 
    everywhere?") from named concepts to ordinary verbs, adjectives, adverbs, and nouns. For each 
    synonym cluster (e.g. keep/preserve/retain/hold; condition/facet/factor), choose the canonical 
    term and replace every deviation. Leave genuine distinctions alone.
  questions:
    - "Is the system name used **consistently** (no accidental name variants)?"
  why:
  examples: {good: [], bad: []}
